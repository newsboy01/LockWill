name: lockwill
description: >
  LockWill - Ứng dụng kiểm soát thời gian dùng thiết bị kết hợp học tập
  theo chương trình GDPT 2018 dành cho học sinh Tiểu học (Lớp 1 - Lớp 5).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/sample_questions.json
