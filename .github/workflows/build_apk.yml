name: Build LockWill Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Generate Android Gradle files and preserve custom code
        run: |
          rm -rf /tmp/lockwill_fresh /tmp/lockwill_custom
          mkdir -p /tmp/lockwill_custom/kotlin /tmp/lockwill_custom/xml
          cp android/app/src/main/AndroidManifest.xml /tmp/lockwill_custom/
          cp -r android/app/src/main/kotlin/com/lockwill/app /tmp/lockwill_custom/kotlin/
          if [ -d "android/app/src/main/res/xml" ]; then
            cp -r android/app/src/main/res/xml/* /tmp/lockwill_custom/xml/
          fi

          flutter create /tmp/lockwill_fresh --org com.lockwill --project-name lockwill --platforms=android

          rm -rf android
          cp -r /tmp/lockwill_fresh/android ./android
          cp /tmp/lockwill_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          if [ "$(ls -A /tmp/lockwill_custom/xml 2>/dev/null)" ]; then
            cp -r /tmp/lockwill_custom/xml/* android/app/src/main/res/xml/
          fi
          rm -rf android/app/src/main/kotlin/com/lockwill/lockwill
          mkdir -p android/app/src/main/kotlin/com/lockwill
          cp -r /tmp/lockwill_custom/kotlin/app android/app/src/main/kotlin/com/lockwill/

          # Đảm bảo namespace và applicationId khớp với com.lockwill.app
          for gradle_file in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$gradle_file" ]; then
              sed -i 's/com\.lockwill\.lockwill/com.lockwill.app/g' "$gradle_file"
            fi
          done

          # Cập nhật App Icon cho toàn bộ mật độ màn hình Android (mipmap-*)
          if [ -d "assets/icon/resized" ]; then
            cp assets/icon/resized/ic_48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp assets/icon/resized/ic_72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/icon/resized/ic_96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp assets/icon/resized/ic_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp assets/icon/resized/ic_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockwill-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish latest APK release for In-App Auto-Updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-apk/app-release.apk"
          }
          EOF
          gh release delete latest-apk --yes || true
          git push origin :refs/tags/latest-apk || true
          gh release create latest-apk \
            build/app/outputs/flutter-apk/app-release.apk \
            version.json \
            --title "LockWill Latest (Build #${{ github.run_number }})" \
            --notes "Bản cập nhật tự động cho ứng dụng LockWill trên Android."
