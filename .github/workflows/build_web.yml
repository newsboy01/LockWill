name: Deploy LockWill Web Demo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate Web runner files
        run: |
          rm -rf /tmp/lockwill_web
          flutter create /tmp/lockwill_web --org com.lockwill --project-name lockwill --platforms=web
          rm -rf web
          cp -r /tmp/lockwill_web/web ./web
          if [ -f "assets/icon/app_icon.png" ]; then
            convert assets/icon/app_icon.png -resize 64x64 web/favicon.png
            convert assets/icon/app_icon.png -resize 192x192 web/icons/Icon-192.png
            convert assets/icon/app_icon.png -resize 512x512 web/icons/Icon-512.png
            convert assets/icon/app_icon.png -resize 192x192 web/icons/Icon-maskable-192.png
            convert assets/icon/app_icon.png -resize 512x512 web/icons/Icon-maskable-512.png
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release
        run: |
          flutter build web --release --base-href "/LockWill/"
          mkdir -p build/web/parent-report build/web/reports
          cp web_parent_report/index.html build/web/parent-report/index.html
          cp docs/reports/learning_data.json build/web/reports/learning_data.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
